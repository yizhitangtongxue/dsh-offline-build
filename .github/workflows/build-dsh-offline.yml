name: Build DSH Offline Bundle

on:
  workflow_dispatch:
    inputs:
      extra_plugins:
        description: "可选：额外 DSH npm 插件，一行一个（在 GitHub 上预装进离线包）"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

env:
  DSH_VERSION: "0.1.1-rc.2"
  DSH_WEBUI_VERSION: "0.2.7"
  PNPM_VERSION: "11.22.0"

jobs:
  build-linux-x64:
    name: Build Linux x86_64 offline bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "${{ env.PNPM_VERSION }}"

      - name: Prepare portable runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/runtime bundle/dsh-home bundle/bin bundle/offline-plugins
          cp payload/runtime-package.json bundle/runtime/package.json
          cp payload/runtime-pnpm-workspace.yaml bundle/runtime/pnpm-workspace.yaml
          cp payload/start.sh bundle/start.sh
          cp payload/install-plugin-offline.sh bundle/install-plugin-offline.sh
          cp payload/verify.sh bundle/verify.sh
          cp payload/README-OFFLINE.md bundle/README.md
          cp payload/pnpm-wrapper.sh bundle/bin/pnpm
          cp -L "$(command -v node)" bundle/bin/node
          chmod +x bundle/start.sh bundle/install-plugin-offline.sh bundle/verify.sh bundle/bin/node bundle/bin/pnpm

      - name: Install official DeepSeek Harness runtime
        working-directory: bundle/runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --prod --frozen-lockfile=false --config.minimum-release-age=0
          node node_modules/@deepseek-ai/dsh/lib/bin.js --version

      - name: Install dsh-web-ui aggregate package
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$GITHUB_WORKSPACE/bundle/dsh-home"
          export PATH="$GITHUB_WORKSPACE/bundle/bin:$PATH"
          CLI="$GITHUB_WORKSPACE/bundle/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"
          PKG="@linxin666/dsh-web-ui-all@$DSH_WEBUI_VERSION"

          # pnpm 11 requires explicit approval for native dependencies.
          # First add populates the dependency graph; if builds are held, approve and retry.
          set +e
          "$GITHUB_WORKSPACE/bundle/bin/node" "$CLI" \
            plugin --profile web add --config.minimum-release-age=0 "$PKG"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            "$GITHUB_WORKSPACE/bundle/bin/node" "$CLI" \
              plugin --profile web approve-builds --all
            "$GITHUB_WORKSPACE/bundle/bin/node" "$CLI" \
              plugin --profile web add --config.minimum-release-age=0 "$PKG"
          fi

      - name: Install optional extra plugins
        if: ${{ inputs.extra_plugins != '' }}
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          export DSH_HOME="$GITHUB_WORKSPACE/bundle/dsh-home"
          export PATH="$GITHUB_WORKSPACE/bundle/bin:$PATH"
          CLI="$GITHUB_WORKSPACE/bundle/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"

          while IFS= read -r plugin; do
            plugin="${plugin%%#*}"
            plugin="$(echo "$plugin" | xargs)"
            [[ -z "$plugin" ]] && continue
            echo "Preinstalling extra plugin: $plugin"
            set +e
            "$GITHUB_WORKSPACE/bundle/bin/node" "$CLI" \
              plugin --profile web add --config.minimum-release-age=0 "$plugin"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              "$GITHUB_WORKSPACE/bundle/bin/node" "$CLI" \
                plugin --profile web approve-builds --all
              "$GITHUB_WORKSPACE/bundle/bin/node" "$CLI" \
                plugin --profile web add --config.minimum-release-age=0 "$plugin"
            fi
          done <<< "$EXTRA_PLUGINS"

      - name: Record build provenance
        shell: bash
        run: |
          set -euo pipefail
          WEBUI_COMMIT="$(git ls-remote https://github.com/zhu1090093659/dsh-web-ui.git refs/heads/dev | cut -f1)"
          cat > bundle/BUILD-INFO.txt <<EOF
          Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Target: linux-x64 (ubuntu-22.04 compatible)
          Node: $(node --version)
          pnpm: $(pnpm --version)
          DeepSeek Harness: $DSH_VERSION
          dsh-web-ui repository: https://github.com/zhu1090093659/dsh-web-ui.git
          dsh-web-ui dev commit: $WEBUI_COMMIT
          dsh-web-ui aggregate package: @linxin666/dsh-web-ui-all@$DSH_WEBUI_VERSION
          Credentials embedded: none
          EOF

      - name: Verify profile and plugin configuration
        shell: bash
        run: |
          set -euo pipefail
          bundle/verify.sh
          PROFILE=bundle/dsh-home/profiles/web/package.json
          python3 - <<'PY'
          import json
          p='bundle/dsh-home/profiles/web/package.json'
          d=json.load(open(p))
          bundles=d['dsh']['profile']['bundles']
          assert '@linxin666/dsh-web-ui-all' in bundles, bundles
          print('Bundles:', bundles)
          print('Dependencies:', d.get('dependencies', {}))
          PY

      - name: Start WebUI smoke test
        shell: bash
        run: |
          set -euo pipefail
          DSH_HOST=127.0.0.1 DSH_PORT=13080 DSH_WORKSPACE="$GITHUB_WORKSPACE" \
            bundle/start.sh > /tmp/dsh-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13080/ > /tmp/dsh-index.html; then
              ok=1
              break
            fi
            sleep 2
          done
          cat /tmp/dsh-smoke.log
          [[ $ok -eq 1 ]] || { echo "WebUI failed to become ready" >&2; exit 1; }
          grep -q '<title>DeepSeek Harness</title>' /tmp/dsh-index.html
          ! grep -q 'Failed to load plugins' /tmp/dsh-smoke.log
          echo "Smoke test passed: HTTP 200 and plugins loaded."

      - name: Package portable artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf dsh-offline-linux-x64.tar.gz -C bundle .
          sha256sum dsh-offline-linux-x64.tar.gz > dsh-offline-linux-x64.tar.gz.sha256
          ls -lh dsh-offline-linux-x64.tar.gz dsh-offline-linux-x64.tar.gz.sha256

      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-offline-linux-x64
          path: |
            dsh-offline-linux-x64.tar.gz
            dsh-offline-linux-x64.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  build-docker-linux-x64:
    name: Build and verify Docker offline image
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Write optional extra plugin list
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXTRA_PLUGINS:-}" > docker/extra-plugins.txt
          echo "Extra plugin lines: $(grep -cv '^\s*$' docker/extra-plugins.txt || true)"

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg DSH_VERSION="$DSH_VERSION" \
            --build-arg DSH_WEBUI_VERSION="$DSH_WEBUI_VERSION" \
            --tag dsh-offline-webui:latest \
            --tag "dsh-offline-webui:${DSH_VERSION}" \
            .
          docker image inspect dsh-offline-webui:latest \
            --format 'image={{.Id}} size={{.Size}} bytes'

      - name: Verify container and workspace mount
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-test-workspace
          printf 'mounted-from-host\n' > docker-test-workspace/MOUNT_TEST.txt
          docker volume create dsh-test-data >/dev/null

          docker run -d --name dsh-webui-test \
            -p 13082:3080 \
            -v "$GITHUB_WORKSPACE/docker-test-workspace:/workspace" \
            -v dsh-test-data:/data \
            dsh-offline-webui:latest >/tmp/dsh-container-id

          cleanup() {
            docker logs dsh-webui-test || true
            docker rm -f dsh-webui-test >/dev/null 2>&1 || true
            docker volume rm dsh-test-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ok=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:13082/ > /tmp/dsh-docker-index.html; then
              ok=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' dsh-webui-test 2>/dev/null || true)" != true ]]; then
              echo "Container exited before WebUI became ready" >&2
              docker logs dsh-webui-test >&2 || true
              exit 1
            fi
            sleep 2
          done
          [[ $ok -eq 1 ]] || { echo "Docker WebUI failed to become ready" >&2; exit 1; }
          grep -q '<title>DeepSeek Harness</title>' /tmp/dsh-docker-index.html
          docker exec dsh-webui-test test -f /workspace/MOUNT_TEST.txt
          [[ "$(docker exec dsh-webui-test cat /workspace/MOUNT_TEST.txt)" = mounted-from-host ]]
          docker exec dsh-webui-test test -f /data/profiles/web/package.json
          docker exec dsh-webui-test grep -q '@linxin666/dsh-web-ui-all' /data/profiles/web/package.json
          ! docker logs dsh-webui-test 2>&1 | grep -q 'Failed to load plugins'
          echo "Docker test passed: HTTP 200, WebUI loaded, workspace mount visible."

      - name: Check image contains no credentials
        shell: bash
        run: |
          set -euo pipefail
          docker history --no-trunc dsh-offline-webui:latest > /tmp/docker-history.txt
          if grep -E 'github_pat_|ghp_[A-Za-z0-9]|DEEPSEEK_API_KEY=' /tmp/docker-history.txt; then
            echo "Credential-like value found in image history" >&2
            exit 1
          fi
          echo "No credential values found in Docker history."

      - name: Export offline Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker save dsh-offline-webui:latest | gzip -1 > dsh-offline-docker-linux-x64.tar.gz
          sha256sum dsh-offline-docker-linux-x64.tar.gz > dsh-offline-docker-linux-x64.tar.gz.sha256
          cp docker-compose.yml docker-compose.offline.yml
          ls -lh dsh-offline-docker-linux-x64.tar.gz dsh-offline-docker-linux-x64.tar.gz.sha256

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-offline-docker-linux-x64
          path: |
            dsh-offline-docker-linux-x64.tar.gz
            dsh-offline-docker-linux-x64.tar.gz.sha256
            docker-compose.offline.yml
          retention-days: 30
          if-no-files-found: error

  build-linux-arm64:
    name: Build and verify Linux ARM64 bundles (native runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 on native ARM64 runner
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "${{ env.PNPM_VERSION }}"

      - name: Write optional extra plugin list
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXTRA_PLUGINS:-}" > docker/extra-plugins.txt
          echo "Extra plugin lines: $(grep -cv '^\s*$' docker/extra-plugins.txt || true)"

      - name: Build and smoke-test ARM64 portable bundle natively
        shell: bash
        env:
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" = aarch64 ]]
          echo "Native runner architecture: $(uname -m)"

          mkdir -p arm64-bundle/runtime arm64-bundle/dsh-home arm64-bundle/bin arm64-bundle/offline-plugins
          cp payload/runtime-package.json arm64-bundle/runtime/package.json
          cp payload/runtime-pnpm-workspace.yaml arm64-bundle/runtime/pnpm-workspace.yaml
          cp payload/start.sh arm64-bundle/start.sh
          cp payload/install-plugin-offline.sh arm64-bundle/install-plugin-offline.sh
          cp payload/verify.sh arm64-bundle/verify.sh
          cp payload/README-OFFLINE.md arm64-bundle/README.md
          cp payload/pnpm-wrapper.sh arm64-bundle/bin/pnpm
          cp -L "$(command -v node)" arm64-bundle/bin/node
          chmod +x arm64-bundle/start.sh arm64-bundle/install-plugin-offline.sh \
            arm64-bundle/verify.sh arm64-bundle/bin/node arm64-bundle/bin/pnpm
          file arm64-bundle/bin/node | tee /tmp/arm64-node-file.txt
          grep -Eqi 'ARM aarch64|ARM64' /tmp/arm64-node-file.txt

          (
            cd arm64-bundle/runtime
            pnpm install --prod --frozen-lockfile=false --config.minimum-release-age=0
          )

          export DSH_HOME="$GITHUB_WORKSPACE/arm64-bundle/dsh-home"
          export PATH="$GITHUB_WORKSPACE/arm64-bundle/bin:$PATH"
          NODE="$GITHUB_WORKSPACE/arm64-bundle/bin/node"
          CLI="$GITHUB_WORKSPACE/arm64-bundle/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"

          install_plugin() {
            local pkg="$1"
            set +e
            "$NODE" "$CLI" plugin --profile web add --config.minimum-release-age=0 "$pkg"
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              "$NODE" "$CLI" plugin --profile web approve-builds --all
              "$NODE" "$CLI" plugin --profile web add --config.minimum-release-age=0 "$pkg"
            fi
          }

          install_plugin "@linxin666/dsh-web-ui-all@$DSH_WEBUI_VERSION"
          while IFS= read -r plugin; do
            plugin="${plugin%%#*}"
            plugin="$(echo "$plugin" | xargs)"
            [[ -z "$plugin" ]] || install_plugin "$plugin"
          done <<< "${EXTRA_PLUGINS:-}"

          WEBUI_COMMIT="$(git ls-remote https://github.com/zhu1090093659/dsh-web-ui.git refs/heads/dev | cut -f1)"
          cat > arm64-bundle/BUILD-INFO.txt <<EOF
          Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Target: linux-arm64 (native GitHub ubuntu-24.04-arm runner)
          Node: $($NODE --version)
          pnpm: $(pnpm --version)
          DeepSeek Harness: $DSH_VERSION
          dsh-web-ui repository: https://github.com/zhu1090093659/dsh-web-ui.git
          dsh-web-ui dev commit: $WEBUI_COMMIT
          dsh-web-ui aggregate package: @linxin666/dsh-web-ui-all@$DSH_WEBUI_VERSION
          Credentials embedded: none
          EOF

          arm64-bundle/verify.sh
          grep -q '@linxin666/dsh-web-ui-all' arm64-bundle/dsh-home/profiles/web/package.json

          DSH_HOST=127.0.0.1 DSH_PORT=13084 DSH_WORKSPACE="$GITHUB_WORKSPACE" \
            arm64-bundle/start.sh >/tmp/dsh-arm64-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:13084/ >/tmp/dsh-arm64-index.html; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/dsh-arm64-smoke.log
          [[ $ok -eq 1 ]]
          grep -q '<title>DeepSeek Harness</title>' /tmp/dsh-arm64-index.html
          ! grep -q 'Failed to load plugins' /tmp/dsh-arm64-smoke.log
          echo "Native ARM64 portable smoke test passed."

      - name: Package ARM64 portable artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf dsh-offline-linux-arm64.tar.gz -C arm64-bundle .
          sha256sum dsh-offline-linux-arm64.tar.gz > dsh-offline-linux-arm64.tar.gz.sha256
          ls -lh dsh-offline-linux-arm64.tar.gz dsh-offline-linux-arm64.tar.gz.sha256

      - name: Upload ARM64 portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-offline-linux-arm64
          path: |
            dsh-offline-linux-arm64.tar.gz
            dsh-offline-linux-arm64.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Build ARM64 Docker image natively
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg DSH_VERSION="$DSH_VERSION" \
            --build-arg DSH_WEBUI_VERSION="$DSH_WEBUI_VERSION" \
            --tag dsh-offline-webui:arm64 \
            .

          [[ "$(docker image inspect dsh-offline-webui:arm64 --format '{{.Architecture}}')" = arm64 ]]
          docker image inspect dsh-offline-webui:arm64 \
            --format 'architecture={{.Architecture}} image={{.Id}} size={{.Size}} bytes'

      - name: Verify ARM64 container and workspace mount
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-test-workspace-arm64
          printf 'mounted-from-arm64-host-test\n' > docker-test-workspace-arm64/MOUNT_TEST.txt
          docker volume create dsh-test-data-arm64 >/dev/null

          docker run -d --platform linux/arm64 --name dsh-webui-test-arm64 \
            -p 13083:3080 \
            -v "$GITHUB_WORKSPACE/docker-test-workspace-arm64:/workspace" \
            -v dsh-test-data-arm64:/data \
            dsh-offline-webui:arm64 >/tmp/dsh-container-id-arm64

          cleanup() {
            docker logs dsh-webui-test-arm64 || true
            docker rm -f dsh-webui-test-arm64 >/dev/null 2>&1 || true
            docker volume rm dsh-test-data-arm64 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ok=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:13083/ > /tmp/dsh-docker-index-arm64.html; then
              ok=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' dsh-webui-test-arm64 2>/dev/null || true)" != true ]]; then
              echo "ARM64 container exited before WebUI became ready" >&2
              docker logs dsh-webui-test-arm64 >&2 || true
              exit 1
            fi
            sleep 2
          done
          [[ $ok -eq 1 ]] || { echo "ARM64 Docker WebUI failed to become ready" >&2; exit 1; }
          grep -q '<title>DeepSeek Harness</title>' /tmp/dsh-docker-index-arm64.html
          docker exec dsh-webui-test-arm64 test -f /workspace/MOUNT_TEST.txt
          [[ "$(docker exec dsh-webui-test-arm64 cat /workspace/MOUNT_TEST.txt)" = mounted-from-arm64-host-test ]]
          docker exec dsh-webui-test-arm64 test -f /data/profiles/web/package.json
          docker exec dsh-webui-test-arm64 grep -q '@linxin666/dsh-web-ui-all' /data/profiles/web/package.json
          ! docker logs dsh-webui-test-arm64 2>&1 | grep -q 'Failed to load plugins'
          echo "ARM64 Docker test passed: HTTP 200, WebUI loaded, workspace mount visible."

      - name: Check ARM64 image contains no credentials
        shell: bash
        run: |
          set -euo pipefail
          docker history --no-trunc dsh-offline-webui:arm64 > /tmp/docker-history-arm64.txt
          if grep -E 'github_pat_|ghp_[A-Za-z0-9]|DEEPSEEK_API_KEY=' /tmp/docker-history-arm64.txt; then
            echo "Credential-like value found in ARM64 image history" >&2
            exit 1
          fi
          echo "No credential values found in ARM64 Docker history."

      - name: Export ARM64 Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker tag dsh-offline-webui:arm64 dsh-offline-webui:latest-arm64
          docker save dsh-offline-webui:arm64 dsh-offline-webui:latest-arm64 \
            | gzip -1 > dsh-offline-docker-linux-arm64.tar.gz
          sha256sum dsh-offline-docker-linux-arm64.tar.gz > dsh-offline-docker-linux-arm64.tar.gz.sha256
          cp docker-compose.yml docker-compose.arm64.offline.yml
          sed -i 's/dsh-offline-webui:latest/dsh-offline-webui:arm64/' docker-compose.arm64.offline.yml
          ls -lh dsh-offline-docker-linux-arm64.tar.gz dsh-offline-docker-linux-arm64.tar.gz.sha256

      - name: Upload ARM64 Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-offline-docker-linux-arm64
          path: |
            dsh-offline-docker-linux-arm64.tar.gz
            dsh-offline-docker-linux-arm64.tar.gz.sha256
            docker-compose.arm64.offline.yml
          retention-days: 30
          if-no-files-found: error
